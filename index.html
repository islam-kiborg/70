<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
        .box {
        width: 70px;
        height: 70px;
        border-radius: 50px;
        position: absolute;
        background-color: red; 
        transition: left 1s linear, top 1s linear, background-color 1s ease;
    }

    .final-r { background-color: rgb(214, 87, 87); }
    .final-t { background-color: rgb(135, 227, 130); }
    .final-l { background-color: rgb(87, 87, 214); }
    .final-b { background-color: rgb(214, 214, 87); }
    .box1 { top: 100px; left: 100px; }
    .box2 { top: 280px; left: 80px; }
    .box3 { top: 40px; left: 250px; }
    .box4 { top: 200px; left: 500px; }
    
    .box5 { top: 380px; left: 400px; }
    .box6 { top: 100px; left: 700px; }
    .box7 { top: 300px; left: 900px; }
    .box8 { top: 150px; left: 990px; }
    .box9 { top: 500px; left: 100px; }
    .box10 { top: 600px; left: 300px; }
    .box11 { top: 400px; left: 500px; }
    
    .box12 { top: 400px; left: 700px; }
    .box13 { top: 200px; left: 900px; }
    .box14 { top: 400px; left: 1000px; }
    .box15 { top: 100px; left: 1100px; }
    .box16 { top: 100px; left: 1200px; }
</style>
</head>
<body>

<h1>очки:<span class="score"></span></h1>


<div class="box box1 r-group"></div>
<div class="box box2 r-group"></div>
<div class="box box3 r-group"></div>
<div class="box box4 r-group"></div>
<div class="box box5 t-group"></div>
<div class="box box6 t-group"></div>
<div class="box box7 t-group"></div>
<div class="box box8 t-group"></div>
<div class="box box9 l-group"></div>
<div class="box box10 l-group"></div>
<div class="box box11 l-group"></div>
<div class="box box12 l-group"></div>
<div class="box box13 b-group"></div>
<div class="box box14 b-group"></div>
<div class="box box15 b-group"></div>
<div class="box box16 b-group"></div>

<script>
    let rightBoxes = document.querySelectorAll('.r-group');
    let downBoxes = document.querySelectorAll('.t-group');
    let leftBoxes = document.querySelectorAll('.l-group');
    let bottomBoxes = document.querySelectorAll('.b-group');
    
    // Set initial score to 0
    document.querySelector('.score').textContent = 0;

    // Handle clicking the boxes
    document.querySelectorAll('.box').forEach(function(box) {
        box.addEventListener('click', function() {
            // Increase score
            let currentScore = parseInt(document.querySelector('.score').textContent, 10) || 0;
            document.querySelector('.score').textContent = currentScore + 1;
            
            // Hide the specific box that was clicked
            this.style.display = 'none';
        });
    });

    // Change colors after 1 second
    setTimeout(function() {
        for (let i = 0; i < rightBoxes.length; i++) {
            rightBoxes[i].classList.add('final-r');
        }
        for (let i = 0; i < downBoxes.length; i++) {
            downBoxes[i].classList.add('final-t');
        }
        for (let i = 0; i < leftBoxes.length; i++) {
            leftBoxes[i].classList.add('final-l');
        }
        for (let i = 0; i < bottomBoxes.length; i++) {
            bottomBoxes[i].classList.add('final-b');
        }
    }, 1000);

    // Move the boxes every 1 second
    setInterval(function() {
        for (let i = 0; i < rightBoxes.length; i++) {
            let box = rightBoxes[i];
            let currentLeft = parseInt(window.getComputedStyle(box).left, 10);
            box.style.left = (currentLeft + 50) + 'px';
        }
        for (let i = 0; i < downBoxes.length; i++) {
            let box = downBoxes[i];
            let currentTop = parseInt(window.getComputedStyle(box).top, 10);
            box.style.top = (currentTop + 50) + 'px';
        }
        for (let i = 0; i < leftBoxes.length; i++) {
            let box = leftBoxes[i];
            let currentLeft = parseInt(window.getComputedStyle(box).left, 10);
            box.style.left = (currentLeft - 50) + 'px';
        }
        for (let i = 0; i < bottomBoxes.length; i++) {
            let box = bottomBoxes[i];
            let currentTop = parseInt(window.getComputedStyle(box).top, 10);
            box.style.top = (currentTop - 50) + 'px';
        }
    }, 1000);
</script>
</body>
</html>
